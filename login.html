<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Nexus Arena | Login</title>
    <meta name="description" content="Sign in to your VR Nexus Arena dashboard to manage bookings and active membership levels.">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    
    <style>
        @media (min-width: 992px) {
            .auth-top-nav .container {
                align-items: center;
            }

            .auth-top-nav .nav-link {
                display: inline-flex;
                align-items: center;
                line-height: 1;
            }
        }

        .auth-divider-badge {
            background: rgba(8, 11, 20, 0.95) !important;
            color: rgba(255, 255, 255, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
        }
        .auth-social-btn {
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            background: rgba(255, 255, 255, 0.02) !important;
            transition: var(--transition-smooth);
        }
        .auth-social-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
        }
        body:not(.dark-mode) .auth-divider-badge {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: rgba(15, 23, 42, 0.1);
        }
        body:not(.dark-mode) .auth-social-btn {
            color: #0f172a !important;
            border-color: rgba(15, 23, 42, 0.2) !important;
            background: rgba(15, 23, 42, 0.02) !important;
        }
        body:not(.dark-mode) .auth-social-btn:hover {
            background: rgba(15, 23, 42, 0.06) !important;
        }

        body.hero-section {
            background-color: var(--theme-bg);
            overflow-y: auto;
            overflow-x: hidden;
        }

        body.dark-mode.hero-section .hero-overlay {
            background: radial-gradient(circle, rgba(109,40,255,0.1) 0%, rgba(8,11,20,0.98) 100%) !important;
        }

        body:not(.dark-mode).hero-section .hero-overlay {
            background: radial-gradient(circle, rgba(109,40,255,0.06) 0%, rgba(248,250,252,0.98) 100%) !important;
        }

        body.dark-mode.hero-section .glow-orb.orb-1 {
            background: var(--primary-color);
            opacity: 0.15;
        }
        body.dark-mode.hero-section .glow-orb.orb-2 {
            background: var(--secondary-color);
            opacity: 0.15;
        }

        body:not(.dark-mode).hero-section .glow-orb.orb-1 {
            background: rgba(109,40,255,0.12);
            opacity: 0.08;
        }
        body:not(.dark-mode).hero-section .glow-orb.orb-2 {
            background: rgba(0, 229, 255, 0.12);
            opacity: 0.08;
        }

        @media (max-width: 767.98px) {
            body.hero-section {
                padding: 80px 0 2rem !important;
            }

            body.hero-section .back-to-top {
                display: none !important;
            }
        }

        /* Link hover styling */
        a.text-info {
            transition: var(--transition-smooth);
        }
        a.text-info:hover {
            color: var(--secondary-color) !important;
            text-decoration: underline !important;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }
        body:not(.dark-mode) a.text-info:hover {
            color: var(--primary-color) !important;
            text-shadow: none;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080B14'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2300E5FF' stroke-width='2'/%3E%3Cpath d='M18 26h28a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4v-6a2 2 0 0 1 2-2z' fill='%236D28FF'/%3E%3C/svg%3E">
</head>
<body class="dark-mode hero-section" style="background-image: none !important; min-height: 100vh; display: block; padding: 72px 0 36px 0; overflow-y: auto; overflow-x: hidden;">

    <div class="hero-overlay" style="background: radial-gradient(circle, rgba(109,40,255,0.1) 0%, rgba(8,11,20,0.98) 100%);"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    
    <!-- Top Nav Minimal -->
    <nav class="navbar navbar-expand-lg fixed-top py-3 auth-top-nav" style="z-index: 10;">
        <div class="container d-flex justify-content-end gap-2">
            <a href="#" id="rtl-toggle" class="topbar-action px-3" aria-label="Toggle RTL">RTL</a>
            <a href="#" id="theme-toggle" class="topbar-action px-3" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></a>
        </div>
    </nav>

    <div class="container position-relative z-2 pt-4 pb-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6 fade-up">
                <div class="glass-card p-5 text-center" style="width: min(100%, 42rem); margin: 0 auto; overflow-x: hidden;">
                    <a class="navbar-brand d-inline-block mb-4" href="index.html">
                        <!-- SVG LOGO -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50" style="display: inline-block; vertical-align: middle;">
                          <circle cx="25" cy="25" r="16" fill="none" class="logo-ring-1" stroke-width="2" opacity="0.8" />
                          <circle cx="25" cy="25" r="19" fill="none" class="logo-ring-2" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.9" />
                          <circle cx="25" cy="25" r="22" fill="none" class="logo-ring-3" stroke-width="1" opacity="0.6" />
                          <path d="M12 21h26a3 3 0 0 1 3 3v4a5 5 0 0 1-5 5H14a5 5 0 0 1-5-5v-4a3 3 0 0 1 3-3z" class="logo-visor" stroke-width="2" />
                          <path d="M16 25h18" class="logo-visor-accent" stroke-width="1.5" stroke-linecap="round" />
                          <circle cx="20" cy="28" r="1.5" class="logo-visor-dot" />
                          <circle cx="30" cy="28" r="1.5" class="logo-visor-dot" />
                          <path d="M9 25c-2 0-3-1-3-3" fill="none" class="logo-ring-1" stroke-width="2" />
                          <path d="M41 25c2 0 3-1 3-3" fill="none" class="logo-ring-1" stroke-width="2" />
                          <text class="logo-text-primary" x="54" y="24" font-family="'Sora', sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">VR NEXUS</text>
                          <text class="logo-text-secondary" x="54" y="38" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ARENA</text>
                        </svg>
                    </a>
                    <h2 class="mb-2 text-white" style="font-family: var(--font-heading);">Welcome Back</h2>
                    <p class="text-white-50 mb-4 small">Sign in to your client dashboard.</p>
                    
                    <form action="dashboard.html" method="get">
                        <div class="mb-3 text-start">
                            <label class="form-label text-white-50 small">Email Address</label>
                            <input type="email" class="form-control bg-transparent text-white border-secondary shadow-none" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4 text-start position-relative">
                            <label class="form-label text-white-50 small">Password</label>
                            <div class="position-relative">
                                <input type="password" id="passwordInput" class="form-control bg-transparent text-white border-secondary shadow-none pe-5" placeholder="********" required>
                                <button type="button" class="btn btn-link text-white-50 position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent shadow-none" id="togglePassword" style="z-index: 10; padding-right: 0.75rem;">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <div class="form-check m-0">
                                    <input class="form-check-input bg-transparent border-secondary shadow-none" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-white-50 small" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none small text-info">Forgot Password?</a>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-premium w-100 mb-4 py-2">Sign In</button>
                        
                        <div class="position-relative mb-4">
                            <hr class="border-secondary">
                            <span class="position-absolute top-50 start-50 translate-middle px-2 small text-white-50 auth-divider-badge">OR</span>
                        </div>
                        
                        <div class="d-flex gap-2 justify-content-center mb-4">
                            <button type="button" class="btn btn-outline-light w-100 auth-social-btn"><i class="fa-brands fa-google me-2"></i> Google</button>
                            <button type="button" class="btn btn-outline-light w-100 auth-social-btn"><i class="fa-brands fa-apple me-2"></i> Apple</button>
                        </div>
                        
                        <p class="text-white-50 small mb-0">Don't have an account? <a href="signup.html" class="text-decoration-none fw-bold text-info">Sign Up</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('passwordInput');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
